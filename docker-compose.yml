services:
  back:
    build:
      context: "."
      dockerfile: Dockerfile
      target: development
    working_dir: /app
    platform: ${BUILD_PLATFORM:-}
    command: [ "yarn", "dev" ]
    container_name: back
    profiles:
      - donotstart
    ports:
      - '3000:3000'
    expose:
      - 3000
    depends_on:
      - postgres
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/ladespen
      - DEFINED_USERNAME=user
      - DEFINED_PASSWORD=password
      - JWT_SECRET=secret

  postgres:
    image: postgres:17
    platform: ${BUILD_PLATFORM:-}
    container_name: postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ladespen
    ports:
      - "5432:5432"
    expose:
      - 5432
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
  app:
