services:
  back:
    build:
      context: "."
      dockerfile: Dockerfile
      target: development
    working_dir: /app
    platform: ${BUILD_PLATFORM:-}
    container_name: back
    ports:
      - '3000:3000'
    expose:
      - 3000
    environment:
      - MONGO_URL=mongodb://root:example@db:27017/nest?authSource=admin

volumes:
  mongo-data:
