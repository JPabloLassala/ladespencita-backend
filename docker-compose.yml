services:
  back:
    build: .
    container_name: back
    ports:
      - '3000:3000'
    expose:
      - 3000
    depends_on:
      - db
    environment:
      - MONGO_URL=mongodb://root:example@db:27017/nest?authSource=admin

  front:
    build:
      context: .
      dockerfile: ../ladespensita/Dockerfile
    container_name: front
    ports:
      - '5173:5173'
    expose:
      - 5173
    depends_on:
      - back

  db:
    image: arm64v8/mongo:latest
    platform: linux/arm64
    restart: always
    container_name: db
    ports:
      - '27017:27017'
    expose:
      - 27017
    volumes:
      - ./db-data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=example
      - MONGO_INITDB_DATABASE=admin

volumes:
  mongo-data:
